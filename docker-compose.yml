services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./data:/app/data"]
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
    depends_on: [backend]
